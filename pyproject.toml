[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-user-swarm"
version = "0.2.0"
description = "LLM-driven personas test a live website in parallel and turn struggle into evidence-backed usability issues."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162",
  "uvicorn[standard]>=0.54",
  "httpx>=0.28",
  "pydantic>=2.14",
  "pyyaml>=6.0",
  "playwright>=1.64",
  "psycopg[binary]>=3.3",
  "cryptography>=50",
]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-timeout>=2.4"]

[project.scripts]
swarm = "swarm.cli:main"

[tool.setuptools.packages.find]
include = ["swarm*", "demo_shop*"]

[tool.setuptools.package-data]
swarm = ["web/**/*", "vendor/**/*", "runtime/injected/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
filterwarnings = ["ignore::DeprecationWarning"]
