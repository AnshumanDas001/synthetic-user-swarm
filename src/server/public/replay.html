<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Session replay</title>
<link rel="stylesheet" href="/player/style.css">
<style>body{margin:0;font:14px system-ui;background:#111;color:#eee}header{padding:10px 16px}a{color:#9cf}#p{display:flex;justify-content:center;padding:8px}</style></head>
<body><header><a href="/">← dashboard</a> · <span id="t"></span></header><div id="p"></div>
<script src="/player/index.js"></script>
<script>
  // "Watch it happen": the rrweb replay opened at the step's timestamp.
  const q = new URLSearchParams(location.search);
  const t = Number(q.get("t") || 0);
  document.getElementById("t").textContent = t ? "starting at " + (t / 1000).toFixed(1) + "s" : "";

  // Strip <script> and preload/modulepreload/prefetch links from recorded DOM, so replays never fetch site code.
  function sanitizeReplay(events) {
    const drop = (n) => n && n.type === 2 && (n.tagName === "script" || (n.tagName === "link" && /preload|prefetch|modulepreload/i.test(String(n.attributes && n.attributes.rel || ""))));
    const walk = (n) => { if (n && n.childNodes) { n.childNodes = n.childNodes.filter((c) => !drop(c)); n.childNodes.forEach(walk); } };
    for (const e of events) {
      if (e.type === 2 && e.data && e.data.node) walk(e.data.node);
      if (e.type === 3 && e.data && Array.isArray(e.data.adds)) e.data.adds = e.data.adds.filter((a) => !drop(a.node)).map((a) => (walk(a.node), a));
    }
    return events;
  }
  
  fetch(q.get("src")).then((r) => r.json()).then((events) => {
    sanitizeReplay(events);
    const meta = events.find((e) => e.type === 4);
    const w = Math.min(1100, (meta && meta.data.width) || 1024);
    const h = Math.round(w * ((meta && meta.data.height) || 768) / ((meta && meta.data.width) || 1024));
    const player = new rrwebPlayer({ target: document.getElementById("p"), props: { events, width: w, height: h, autoPlay: false } });
    if (t) player.goto(t, true);
  });
</script></body></html>
